name: build-docker

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choise
        description: 'Application environment.'
        required: true
        options:
          - development
          - production
      dry-run:
        type: boolean
        description: 'Dry run, do not push containers to the registry.'
        required: true
        default: false

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.ref_name }}.${{ github.sha }}.build-docker.${{ github.event.inputs.environment }}.${{ github.event.inputs.dry-run }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Print inputs
        run: |
          echo "Dry run: ${{ github.event.inputs.dry-run }}"
          echo "Environment: ${{ github.event.inputs.environment }}"

      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Check origin
        uses: ./.github/actions/check-origin

      - name: Docker login
        run: yarn docker:login "$DOCKER_REGISTRY_USER" "$DOCKER_REGISTRY_ACCESS_TOKEN"
        env:
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
          DOCKER_REGISTRY_ACCESS_TOKEN: ${{ secrets.DOCKER_REGISTRY_ACCESS_TOKEN }}

      - name: Docker build
        run: |
          bash ./tools/docker/build.sh api "$ENVIRONMENT"
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}

      - name: Docker push apps
        if: github.event.inputs.dry-run == false
        run: |
          bash ./tools/docker/push.sh api-"$ENVIRONMENT"
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}

      - name: Docker cleanup
        if: always()
        run: |
          bash ./tools/shell/docker/task.sh cleanup
          docker logout
